<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zettl - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Neo-Brutalist Color Palette */
            --bg-main: #FFF8E7;
            --bg-dark: #1E1E1E;
            --primary: #FF5E5B;
            --secondary: #FFCC00;
            --accent: #00D9FF;
            --success: #00FF88;
            --text-dark: #1E1E1E;
            --text-light: #FFF8E7;
            --border-dark: #1E1E1E;
            --shadow-color: #1E1E1E;
            --error-color: #FF5E5B;

            /* Spacing & Borders */
            --border-width: 4px;
            --border-width-thick: 6px;
            --shadow-offset: 6px;
            --shadow-offset-lg: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Decorative background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 100px,
                    rgba(255, 94, 91, 0.03) 100px,
                    rgba(255, 94, 91, 0.03) 200px
                );
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: var(--bg-main);
            border: var(--border-width-thick) solid var(--border-dark);
            box-shadow: var(--shadow-offset-lg) var(--shadow-offset-lg) 0 var(--shadow-color);
            width: 100%;
            max-width: 450px;
            transform: rotate(-1deg);
            animation: wobble 10s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg); }
        }

        .login-header {
            background: var(--secondary);
            padding: 30px;
            border-bottom: var(--border-width-thick) solid var(--border-dark);
            text-align: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -4px;
            color: var(--text-dark);
            display: inline-block;
            transform: rotate(-3deg);
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 30px;
            font-size: 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-content {
            padding: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            color: var(--text-dark);
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 15px;
            background: var(--bg-main);
            border: var(--border-width) solid var(--border-dark);
            color: var(--text-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 500;
            box-shadow: inset 3px 3px 0 rgba(30, 30, 30, 0.1);
        }

        input:focus {
            outline: none;
            box-shadow: inset 0 0 0 3px var(--accent);
        }

        button {
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            background: var(--success);
            color: var(--text-dark);
            border: var(--border-width) solid var(--border-dark);
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--shadow-color);
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Space Grotesk', sans-serif;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: calc(var(--shadow-offset) + 2px) calc(var(--shadow-offset) + 2px) 0 var(--shadow-color);
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 var(--shadow-color);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .success-message {
            color: var(--primary-color);
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .tabs {
            display: flex;
            background: var(--primary);
            border-bottom: var(--border-width) solid var(--border-dark);
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-light);
            border-right: var(--border-width) solid var(--border-dark);
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .tab:last-child {
            border-right: none;
        }

        .tab.active {
            background: var(--accent);
            color: var(--text-dark);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--input-border);
            text-align: center;
            font-size: 12px;
            color: #888;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #000;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">ZETTL</div>
            <div class="tagline">Minimalist Knowledge Base</div>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="login">Login</div>
            <div class="tab" data-tab="register">Register</div>
        </div>

        <!-- Login Form -->
        <div class="tab-content active form-content" id="login-tab">
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Username or Email</label>
                    <input type="text" id="login-username" name="username" required autocomplete="username" autocapitalize="none">
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" id="login-button">Login</button>

                <div class="error-message" id="login-error"></div>
                <div class="success-message" id="login-success"></div>
            </form>
        </div>

        <!-- Register Form -->
        <div class="tab-content form-content" id="register-tab">
            <form id="register-form">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" name="username" required autocomplete="username" autocapitalize="none">
                </div>

                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" required autocomplete="email" autocapitalize="none">
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" required autocomplete="new-password" minlength="8">
                </div>

                <div class="form-group">
                    <label for="register-confirm">Confirm Password</label>
                    <input type="password" id="register-confirm" name="confirm" required autocomplete="new-password">
                </div>

                <button type="submit" id="register-button">Register</button>

                <div class="error-message" id="register-error"></div>
                <div class="success-message" id="register-success"></div>
            </form>
        </div>

        <div class="info">
            Secure, self-hosted Zettelkasten
        </div>
    </div>

    <script>
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and contents
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));

                // Add active class to clicked tab and corresponding content
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const button = document.getElementById('login-button');
            const errorDiv = document.getElementById('login-error');
            const successDiv = document.getElementById('login-success');

            // Reset messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            // Disable button
            button.disabled = true;
            button.innerHTML = 'Logging in<span class="loading"></span>';

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successDiv.textContent = 'Login successful! Redirecting...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.style.display = 'block';
                    button.disabled = false;
                    button.textContent = 'Login';
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
                button.disabled = false;
                button.textContent = 'Login';
            }
        });

        // Register form submission
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const button = document.getElementById('register-button');
            const errorDiv = document.getElementById('register-error');
            const successDiv = document.getElementById('register-success');

            // Reset messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;

            if (password !== confirm) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            // Disable button
            button.disabled = true;
            button.innerHTML = 'Creating account<span class="loading"></span>';

            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;

            try {
                // Register with auth service via Flask proxy
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successDiv.textContent = 'Account created successfully! You can now login.';
                    successDiv.style.display = 'block';

                    // Clear form
                    document.getElementById('register-form').reset();

                    // Switch to login tab after 2 seconds
                    setTimeout(() => {
                        document.querySelector('.tab[data-tab="login"]').click();
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                button.disabled = false;
                button.textContent = 'Register';
            }
        });
    </script>
</body>
</html>
